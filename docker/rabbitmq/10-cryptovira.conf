# RabbitMQ 4 refuses deprecated features by default. Celery's remote-control (pidbox) and event
# channels still declare *transient, non-exclusive* queues, so a worker cannot start against a
# stock RabbitMQ 4 node:
#
#   amqp.exceptions.InternalError: Queue.declare: (541) INTERNAL_ERROR -
#   Feature `transient_nonexcl_queues` is deprecated.
#
# Permitting it here is the narrow fix. The alternative — disabling remote control and events —
# also disables `celery inspect ping`, which is how the worker's health check works.
#
# REVISIT when kombu declares those queues durable or exclusive: the feature is slated for
# removal in a future RabbitMQ major, at which point this flag stops being an option.
deprecated_features.permit.transient_nonexcl_queues = true
